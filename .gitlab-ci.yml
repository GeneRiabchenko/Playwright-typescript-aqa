# GitLab CI counterpart of .github/workflows/playwright.yml.
# Required CI/CD variables (Settings → CI/CD → Variables, masked): ACCOUNT_USERNAME, ACCOUNT_PASSWORD.
image: mcr.microsoft.com/playwright:v1.62.1-noble # keep in sync with @playwright/test in package.json

stages:
  - static
  - test
  - report

variables:
  BASE_URL: https://playground.bondaracademy.com
  CONDUIT_URL: https://conduit.bondaracademy.com/
  API_URL: https://conduit-api.bondaracademy.com/api/
  TAGS_API_URL: '*/**/api/tags'
  ARTICLES_API_URL: '*/**/api/articles*'
  CI: 'true'

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/]
  before_script:
    - npm ci

typecheck-and-lint:
  stage: static
  script:
    - npm run typecheck
    - npm run lint

# Writes the Linux screenshot baselines once and caches them (the repo doesn't commit them: they're
# platform-specific). Later jobs only pull the cache. `|| true`: this job only exists to write
# screenshots — real failures (the a11y specs are red on purpose) are reported by smoke/regression.
prepare-baselines:
  stage: static
  timeout: 20m
  cache:
    key: playwright-snapshots-v2
    paths: [tests/**/*-snapshots/]
    policy: pull-push
  script:
    - |
      if ! ls tests/ui/*-snapshots >/dev/null 2>&1; then
        npx playwright test tests/ui/forms-layouts.spec.ts tests/ui/top-navigation.spec.ts --update-snapshots --retries=0 --reporter=list || true
      fi

# Fast gate on every pipeline: API tests + @smoke-tagged UI/mocking tests (chromium only).
smoke:
  stage: test
  needs: [prepare-baselines]
  cache:
    - key:
        files: [package-lock.json]
      paths: [node_modules/]
    - key: playwright-snapshots-v2
      paths: [tests/**/*-snapshots/]
      policy: pull
  script:
    - npx playwright test --grep @smoke --project=chromium --project=chromium-network-mocking --project=setup --project=api
  artifacts:
    when: always
    expire_in: 7 days
    paths: [playwright-report/, allure-results/]

# Full regression, sharded over two parallel jobs. Visual (toHaveScreenshot) baselines are
# platform-specific and not committed: they are generated on the first run and cached.
regression:
  stage: test
  parallel: 2
  needs: [typecheck-and-lint, prepare-baselines]
  cache:
    - key:
        files: [package-lock.json]
      paths: [node_modules/]
    - key: playwright-snapshots-v2
      paths: [tests/**/*-snapshots/]
      policy: pull
  script:
    - npx playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=blob,allure-playwright --grep @regression
  artifacts:
    when: always
    expire_in: 7 days
    paths: [blob-report/, allure-results/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

html-report:
  stage: report
  needs: [regression]
  when: always
  script:
    - npx playwright merge-reports --reporter=html ./blob-report
  artifacts:
    expire_in: 14 days
    paths: [playwright-report/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Publishes the merged HTML report to GitLab Pages (default branch only):
# https://<namespace>.gitlab.io/<project>/
# Needs Pages enabled (Deploy → Pages) on the GitLab project.
pages:
  stage: report
  needs:
    - job: html-report
      artifacts: true
  script:
    - mkdir -p public
    - cp -r playwright-report/. public/
  artifacts:
    paths: [public]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
