name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Restore visual regression baselines
      id: snapshot-cache
      uses: actions/cache@v4
      with:
        path: tests/**/*-snapshots
        key: playwright-snapshots-v2

    - name: Generate baseline snapshots (first run only)
      if: steps.snapshot-cache.outputs.cache-hit != 'true'
      run: |
        npx playwright test --update-snapshots
        # this run only creates baselines; keep it out of the Allure report
        rm -rf allure-results

    # Allure history (trends) lives in history.jsonl; carry it over between runs.
    # Keys are immutable, so use a unique key per run and restore the latest one.
    - name: Restore Allure history
      uses: actions/cache/restore@v4
      with:
        path: history.jsonl
        key: allure-history-${{ github.run_id }}
        restore-keys: allure-history-

    - name: Run Playwright tests with Allure
      run: npx allure run -- npx playwright test

    - name: Save Allure history
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: history.jsonl
        key: allure-history-${{ github.run_id }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Only main is published to Pages (the github-pages environment rejects PR branches).
    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      with:
        path: allure-report/

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
