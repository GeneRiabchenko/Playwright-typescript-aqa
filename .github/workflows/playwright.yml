name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  # Runs once (not per shard) so the snapshot cache is seeded before the matrix starts.
  prepare-baselines:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Restore visual regression baselines
      id: snapshot-cache
      uses: actions/cache@v4
      with:
        path: tests/**/*-snapshots
        key: playwright-snapshots-v2

    - name: Generate baseline snapshots (first run only)
      if: steps.snapshot-cache.outputs.cache-hit != 'true'
      run: npx playwright test --update-snapshots

  test:
    needs: prepare-baselines
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Restore-only: prepare-baselines owns writing this key.
    - name: Restore visual regression baselines
      uses: actions/cache/restore@v4
      with:
        path: tests/**/*-snapshots
        key: playwright-snapshots-v2

    - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob,allure-playwright

    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report/
        retention-days: 1

    - name: Upload Allure results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.shardIndex }}
        path: allure-results/
        retention-days: 1

  merge-reports:
    needs: test
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Download blob reports
      uses: actions/download-artifact@v4
      with:
        pattern: blob-report-*
        path: all-blob-reports
        merge-multiple: true

    - name: Merge into Playwright HTML report
      run: npx playwright merge-reports --reporter=html ./all-blob-reports

    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results
        merge-multiple: true

    # Allure history (trends) lives in history.jsonl; carry it over between runs.
    # Keys are immutable, so use a unique key per run and restore the latest one.
    - name: Restore Allure history
      uses: actions/cache/restore@v4
      with:
        path: history.jsonl
        key: allure-history-${{ github.run_id }}
        restore-keys: allure-history-

    - name: Generate Allure report
      run: npx allure generate ./allure-results

    - name: Save Allure history
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: history.jsonl
        key: allure-history-${{ github.run_id }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Only main is published to Pages (the github-pages environment rejects PR branches).
    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      with:
        path: allure-report/

  deploy-report:
    needs: merge-reports
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
